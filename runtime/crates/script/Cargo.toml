[package]
name = "script"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
accountable-refcell = { workspace = true, optional = true }
servo_config = { workspace = true }
deny_public_fields = { workspace = true }
devtools_traits = { workspace = true }
dom_struct = { workspace = true }
domobject_derive = { workspace = true }
fnv = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
js.workspace = true
jstraceable_derive.workspace = true
libc.workspace = true
log.workspace = true
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
num-traits.workspace = true
phf = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
script_bindings = { path = "../script_bindings" }
servo_url = { workspace = true }
stylo_atoms = { workspace = true }
time = { workspace = true }
tracing = { workspace = true, optional = true }
utf-8 = "0.7"

[features]
crown = ['js/crown']
debugmozjs = ['js/debugmozjs']
